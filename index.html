<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Raagalaya Academy — Carnatic Vocal Music</title>
    <meta name="description" content="Raagalaya Academy — a Carnatic vocal music school preserving the guru-shishya parampara, teaching students in-person and online." />
    <meta name="author" content="Raagalaya Academy" />
    <meta name="keywords" content="Carnatic music, vocal music classes, Carnatic vocal lessons, Indian classical music, music academy, online Carnatic classes, guru shishya parampara, Raagalaya Academy" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://raagalayaacademy.com/" />
    <meta name="google-site-verification" content="-34GRmNPnlgCf0g1fmalvOyQike-sxpsD5nHl7mAXXg" />

    <meta property="og:title" content="Raagalaya Academy" />
    <meta property="og:url" content="https://raagalayaacademy.com/" />
    <meta property="og:site_name" content="Raagalaya Academy" />
    <meta property="og:description" content="Carnatic vocal music school — classes, events, and performances." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />

    <!--
      Netlify Identity widget — catches invite / password-reset / confirmation
      tokens that arrive in the URL fragment, opens the right modal, and
      redirects to /admin after a successful login.
    -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Raagalaya Academy",
        "url": "https://raagalayaacademy.com/",
        "logo": "https://raagalayaacademy.com/favicon.png",
        "description": "Carnatic vocal music school preserving the guru-shishya parampara, teaching students in-person and online.",
        "sameAs": []
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!--
      Static placeholder Netlify can detect at build time. The real form
      lives in src/pages/Contact.tsx; this skeleton just registers the
      form name + fields with Netlify so submissions are accepted.
      Hidden from users via the hidden attribute.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="interest" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // After a successful sign-in (or first-time password set via invite),
      // bounce the editor into /admin where Decap CMS lives.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function (user) {
          if (!user) {
            window.netlifyIdentity.on("login", function () {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
