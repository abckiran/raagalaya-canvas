[build]
  command = "npm run build"
  publish = "dist"

# Make sharp's native binary install correctly in Netlify's Linux build env
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=optional"

# SPA fallback — every non-asset path serves the React shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
